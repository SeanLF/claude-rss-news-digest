# Two whole-digest judges from two families (spec §7.2), each run --repeat 5 on the same digest so
# its self-agreement is known before any score counts. Run with `make judges`; then
# `node dist/cli/agreement.js <output.json>` for the agreement and disagreement figures.
description: whole-digest judges, band first
prompts: [file://../dist/gate/judge-prompt.js]
providers:
  - id: anthropic:claude-agent-sdk
    label: claude-opus-5-5
    # apiKeyRequired false: the worker authenticates with the subscription's CLAUDE_CODE_OAUTH_TOKEN, not an API key.
    config: { model: claude-opus-5-5, apiKeyRequired: false, working_dir: ../../docs/proposed/gate-fixtures/day-300/inputs, permission_mode: dontAsk }
  - id: openai:codex-sdk
    label: codex
    # promptfoo withholds CODEX_HOME from the Codex process unless cli_env names it; the Makefile copies the login there.
    config: { working_dir: ../../docs/proposed/gate-fixtures/day-300/inputs, sandbox_mode: read-only, skip_git_repo_check: true, cli_env: { CODEX_HOME: /tmp/codex }, codex_path_override: /tmp/cx/node_modules/.bin/codex }
tests:
  # Every path here resolves against this file's directory (gate/), not the working directory.
  - vars: { digest: file://../../docs/proposed/gate-fixtures/day-300/digest.html }
    assert:
      - type: javascript
        value: "(() => { const s = output.indexOf('['), e = output.lastIndexOf(']'); return s >= 0 && e > s && Array.isArray(JSON.parse(output.slice(s, e + 1))); })()"

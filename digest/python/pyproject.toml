[project]
name = "digest-python"
version = "0.1.0"
description = "The digest workflow's Python activity (fulltext) on its own Temporal worker"
requires-python = ">=3.14"
# lxml is the parser the fulltext fork measured, so it is pinned with trafilatura.
dependencies = [
    "temporalio==1.33.0",
    "trafilatura==2.2.0",
    "lxml==6.1.3",
    # The fetch itself (fulltext._download), no longer trafilatura's.
    "urllib3==2.8.0",
    "certifi==2026.7.22",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

# Local Temporal for the digest worker: the Temporal CLI's dev server (Server 1.32.0 + UI, SQLite on a
# volume), the worker, and the Python fulltext worker. Production's Postgres-backed server is plan C's; this is for local runs.
# Usage: make temporal-up / make digest-start DATE=YYYY-MM-DD / make temporal-down
services:
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    volumes: [temporal-data:/data]
    user: "0:0" # the image's own user cannot write a fresh root-owned volume; local dev only
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
  digest-worker:
    build: { context: .., dockerfile: digest/Dockerfile }
    depends_on: [temporal]
    # Each model call is its own Claude Code CLI process and four run at once in a fan-out; 512 MiB
    # was OOM-killed on the first band. A worker that dies comes back and Temporal resumes the run.
    mem_limit: 2g
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}" # from the repo-root .env via --env-file (Makefile)
      DIGEST_DB_PATH: "${DIGEST_DB_PATH:-/app/data/digest.db}" # point at a scratch copy for a port check
    volumes:
      - ../data:/app/data
      - claude-sessions:/home/appuser/.claude
  # trafilatura stays in Python (docs/2026-09-23-fulltext-extractor-fork.md): the fetch is an activity
  # on the `fulltext` task queue. If it is down, a run goes on without full text after 5 minutes.
  fulltext-worker:
    build: { context: .., dockerfile: digest/fulltext/Dockerfile }
    depends_on: [temporal]
    mem_limit: 512m
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
  # The gate's judges (make judges). Codex needs its own sandbox (bubblewrap) to read the fixture
  # read-only, and Docker's default seccomp profile blocks it; unconfined here keeps Codex's sandbox
  # on instead of running it with full access over untrusted publisher text. Local evals only.
  digest-judge:
    extends: { service: digest-worker }
    security_opt: ["seccomp=unconfined"]
    restart: "no"
    profiles: ["judge"]
volumes:
  temporal-data: {}
  claude-sessions:
    external: true
    name: news-digest_claude-sessions

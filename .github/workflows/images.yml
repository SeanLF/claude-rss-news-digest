# The three production images, built and pushed to ghcr only when the dependency scan passes: an image
# that fails it never exists in the registry, so Kamal (seanfloyd-infra) has nothing to pull. Tagged by the
# full commit SHA, which is the version Kamal deploys.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=digest/package-lock.json
        --lockfile=digest/python/uv.lock

  build:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: digest-worker
            file: digest/Dockerfile
            target: worker
          - name: digest-site
            file: digest/Dockerfile
            target: site
          - name: digest-python
            file: digest/python/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: short
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/seanlf/${{ matrix.name }}:${{ github.sha }}
          # Kamal refuses an image without the service label; GIT_SHA is the worker's build id
          # (Worker Versioning) and what runs.git_sha records.
          labels: |
            service=${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            GIT_SHA=${{ steps.short.outputs.sha }}
            OCI_REVISION=${{ github.sha }}
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/seanlf/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

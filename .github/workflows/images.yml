# The three production images, built and pushed to ghcr only from main and only when the tests and the
# dependency scan pass: an image that fails either never exists in the registry, so Kamal (seanfloyd-infra)
# has nothing to pull. Tagged by the full commit SHA, which is the version Kamal deploys.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  # The repo's own CI (bin/ci): the TypeScript, Python worker and bin/ scripts suites, each in its container.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bin/ci

  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=digest/package-lock.json
        --lockfile=digest/python/uv.lock

  build:
    needs: [test, scan]
    # workflow_dispatch runs on any branch; only main's commits become deployable images.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: digest-worker
            file: digest/Dockerfile
            target: worker
          - name: digest-site
            file: digest/Dockerfile
            target: site
          - name: digest-python
            file: digest/python/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: short
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/seanlf/${{ matrix.name }}:${{ github.sha }}
          # Kamal refuses an image without the service label; GIT_SHA is the worker's build id
          # (Worker Versioning) and what runs.git_sha records.
          labels: |
            service=${{ matrix.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            GIT_SHA=${{ steps.short.outputs.sha }}
            OCI_REVISION=${{ github.sha }}
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/seanlf/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The newest 10 images per package; older ones go, with their platform manifests and attestations,
  # which the action deletes with the image that refers to them (a version-count cleanup would not).
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    concurrency:
      group: ghcr-cleanup
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: digest-worker,digest-site,digest-python
          keep-n-tagged: 10

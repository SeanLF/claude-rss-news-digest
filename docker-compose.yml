services:
  digest-newsroom:
    build:
      context: .
      dockerfile: newsroom/Dockerfile
    environment:
      - ANTHROPIC_API_KEY
      - CLAUDE_CODE_OAUTH_TOKEN
      - RESEND_API_KEY
      - RESEND_FROM
      - DIGEST_EMAIL
      - DIGEST_NAME
      - DIGEST_DOMAIN
      - AUTHOR_NAME
      - AUTHOR_URL
      - ARCHIVE_URL
      - SOURCE_URL
      - IN_DOCKER=1
      # Optional (have defaults):
      - HEALTH_ALERT_EMAIL
      - HEALTH_ALERT_THRESHOLD
      - RSS_MAX_RETRIES
      - RSS_RETRY_DELAY
    volumes:
      - ./data:/app/data
      - claude-sessions:/home/appuser/.claude
      - bash-history:/home/appuser/.bash_history_dir
      - ./newsroom/templates/digest.css:/app/templates/digest.css:ro
      - ./prompts:/app/prompts:ro

  ci:
    build:
      context: .
      dockerfile: newsroom/Dockerfile.ci
    working_dir: /app
    environment:
      - IN_DOCKER=1
    volumes:
      - .:/app
    entrypoint: ["python3", "bin/ci"]

  ci-rust:
    build:
      context: ./circulation
      dockerfile: Dockerfile.ci
    working_dir: /app
    volumes:
      - ./circulation:/app
      - ./newsroom/sources.json:/app/sources.json:ro
      - cargo-cache:/usr/local/cargo/registry
    entrypoint: ["sh", "-c"]
    command: ["cargo fmt --check && cargo clippy -- -D warnings && cargo test"]

  digest-circulation:
    build:
      context: .
      dockerfile: circulation/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro
    environment:
      - DATABASE_PATH=/data/digest.db
      - DIGEST_NAME=${DIGEST_NAME:-News Digest}
      - HOMEPAGE_URL
      - SOURCE_URL
      - RESEND_API_KEY
      - RESEND_AUDIENCE_ID
    labels:
      - dev.orbstack.domains=${ORBSTACK_DOMAIN:-}

volumes:
  claude-sessions:
  bash-history:
  cargo-cache:

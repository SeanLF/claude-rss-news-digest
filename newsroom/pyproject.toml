[project]
name = "news-digest"
version = "0.1.0"
description = "Automated news digest: RSS feeds → Claude curation → HTML email"
requires-python = ">=3.14"
dependencies = [
    "feedparser",
    "resend",
    "mjml-python",
    "jsonschema",
    "yoyo-migrations",
    "beautifulsoup4",
    "claude-agent-sdk",
    "scikit-learn",
    "trafilatura",
    # Google-News redirect decoding. Replaces a hand-rolled batchexecute RPC that broke within a
    # day of shipping and resolved 0 links for 25 digests.
    #
    # Pinned to our fork at a COMMIT, not a branch: a branch ref makes the image contents depend
    # on when it was built, which is the "what was actually under test" problem in packaging
    # form. A codeload tarball rather than git+https, so the builder image needs no git binary
    # (python:3.14-slim has none, and the build fails outright without it).
    #
    # PyPI 0.1.7 also decodes correctly -- measured 6/6 on live tokens -- so this is not a
    # correctness dependency. It buys hardening: bounded decompression, tag-keyed batch mapping,
    # UTF-8 payloads, and a varint length that does not truncate URLs over 128 bytes.
    #
    # NOT a drop-in swap back to PyPI. gnews.py calls `decode(url, timeout=...)` and reads
    # `http_status` off a failed result; 0.1.7 has neither, so reverting means restoring the
    # `gnewsdecoder(url, interval=...)` call site, accepting a hardcoded 15s timeout, and losing
    # the 429 signal that stops a throttled batch.
    #
    # This pin also carries a per-decode saving: the locale rides on the article URL so Google no
    # longer answers with a redirect, and the smaller `/rss/articles` page is tried first. Two round
    # trips instead of three when that smaller page parses, three when it does not; the page itself
    # is about 29% fewer bytes on the wire.
    "googlenewsdecoder @ https://github.com/SeanLF/google-news-url-decoder/archive/4860ab58e633c08d86fded1af69ae249ab6de2cb.tar.gz",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "bandit",
    "pytest",
]
# Offline-only eval extras: MiniLM embeddings for the cross-story dedup grader's
# LIVE path (eval_dedup_grader.embed). NOT in the prod pipeline (never runs on the
# Hetzner box) and NOT in CI -- the regression tests score off precomputed cosines.
# Install locally for GEPA scoring with: uv sync --extra eval
eval = [
    "sentence-transformers",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (let formatter handle it)
    "SIM108", # ternary operator (sometimes if/else is clearer)
    "PTH123", # open() vs Path.open() - open() is fine
    "RUF001", # ambiguous unicode (en dash in email subject is intentional)
]

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false  # TODO: enable once all functions are typed
ignore_missing_imports = true
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603", "B607"]  # subprocess usage is expected for this tool

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

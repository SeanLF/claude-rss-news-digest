<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Data flow: RSS feeds are fetched, deduplicated and given opaque IDs in Python; Claude clusters, recaps, selects, writes one story per call, writes the preheader, fact-checks and repairs; Python assembles, resolves IDs to URLs, renders and sends.">
  <title>News digest pipeline</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8efed"/>
    </marker>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5cb8c6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#0c1113"/>

  <text x="8" y="40" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#e8efed" opacity=".7" letter-spacing="1">PYTHON</text>
  <text x="8" y="170" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#5cb8c6" letter-spacing="1">CLAUDE</text>
  <text x="8" y="536" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#e8efed" opacity=".7" letter-spacing="1">PYTHON</text>

  <!-- intake -->
  <rect x="86" y="18" width="118" height="42" rx="3" fill="#141c1f" stroke="#e8efed" stroke-width="1.4"/>
  <text x="145" y="36" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e8efed">RSS feeds</text>
  <text x="145" y="51" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#e8efed" opacity=".65">sources.json</text>

  <line x1="204" y1="39" x2="252" y2="39" stroke="#e8efed" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="228" y="31" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".7">fetch</text>

  <rect x="252" y="18" width="150" height="42" rx="3" fill="#141c1f" stroke="#e8efed" stroke-width="1.4"/>
  <text x="327" y="36" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e8efed">window + dedup</text>
  <text x="327" y="51" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#e8efed" opacity=".65">since last run · TF-IDF</text>

  <line x1="402" y1="39" x2="450" y2="39" stroke="#e8efed" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="450" y="18" width="168" height="42" rx="3" fill="#141c1f" stroke="#e8efed" stroke-width="1.4"/>
  <text x="534" y="36" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e8efed">assign opaque IDs</text>
  <text x="534" y="51" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#e8efed" opacity=".65">A1, A2, A3…</text>

  <line x1="618" y1="39" x2="700" y2="39" stroke="#e8efed" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="708" y="35" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#e8efed" opacity=".8">URLs stay in Python.</text>
  <text x="708" y="49" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#e8efed" opacity=".8">Claude never sees them.</text>

  <line x1="534" y1="60" x2="534" y2="86" stroke="#5cb8c6" stroke-width="1.6" marker-end="url(#arf)"/>

  <!-- Claude lane -->
  <rect x="86" y="88" width="828" height="356" rx="4" fill="none" stroke="#5cb8c6" stroke-width="1.2" stroke-dasharray="3 3" opacity=".55"/>

  <!-- CLUSTER fan-out -->
  <rect x="120" y="120" width="150" height="56" rx="3" fill="none" stroke="#5cb8c6" stroke-width="1" opacity=".45"/>
  <rect x="116" y="116" width="150" height="56" rx="3" fill="none" stroke="#5cb8c6" stroke-width="1" opacity=".7"/>
  <rect x="112" y="112" width="150" height="56" rx="3" fill="#141c1f" stroke="#5cb8c6" stroke-width="1.6"/>
  <text x="187" y="131" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#5cb8c6">CLUSTER ×N</text>
  <text x="187" y="146" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" fill="#e8efed" opacity=".75">tags for 40 articles a call</text>
  <text x="187" y="160" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".55">4 in flight · Sonnet 4.6</text>

  <line x1="187" y1="176" x2="187" y2="200" stroke="#5cb8c6" stroke-width="1.5" marker-end="url(#arf)"/>
  <rect x="112" y="202" width="150" height="34" rx="3" fill="#141c1f" stroke="#e8efed" stroke-width="1.2"/>
  <text x="187" y="217" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#e8efed">deterministic join</text>
  <text x="187" y="230" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".65">TF-IDF over tags · Python</text>

  <rect x="112" y="258" width="150" height="48" rx="3" fill="#141c1f" stroke="#5cb8c6" stroke-width="1.6" opacity=".7"/>
  <text x="187" y="277" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#5cb8c6">RECAP</text>
  <text x="187" y="291" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" fill="#e8efed" opacity=".75">last week's themes</text>
  <text x="187" y="303" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".55">Haiku 4.5</text>
  <text x="187" y="326" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10" fill="#e8efed" opacity=".6" font-style="italic">runs after, not alongside:</text>
  <text x="187" y="338" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10" fill="#e8efed" opacity=".6" font-style="italic">it takes seconds</text>

  <line x1="262" y1="219" x2="308" y2="232" stroke="#5cb8c6" stroke-width="1.5" marker-end="url(#arf)"/>
  <line x1="262" y1="282" x2="308" y2="252" stroke="#5cb8c6" stroke-width="1.5" marker-end="url(#arf)"/>

  <!-- SELECT -->
  <rect x="308" y="216" width="136" height="52" rx="3" fill="#141c1f" stroke="#5cb8c6" stroke-width="1.6"/>
  <text x="376" y="236" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#5cb8c6">SELECT</text>
  <text x="376" y="251" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" fill="#e8efed" opacity=".75">tiers, regions, order</text>
  <text x="376" y="263" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".55">Sonnet 4.6</text>

  <line x1="444" y1="242" x2="478" y2="242" stroke="#5cb8c6" stroke-width="1.5" marker-end="url(#arf)"/>
  <text x="461" y="233" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9" fill="#e8efed" opacity=".65">N ×</text>

  <!-- WRITE fan-out -->
  <rect x="490" y="228" width="160" height="64" rx="3" fill="none" stroke="#5cb8c6" stroke-width="1" opacity=".4"/>
  <rect x="485" y="223" width="160" height="64" rx="3" fill="none" stroke="#5cb8c6" stroke-width="1" opacity=".6"/>
  <rect x="480" y="218" width="160" height="64" rx="3" fill="#141c1f" stroke="#5cb8c6" stroke-width="1.8"/>
  <text x="560" y="237" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#5cb8c6">WRITE ×N</text>
  <text x="560" y="251" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" fill="#e8efed" opacity=".75">one story, its own cluster</text>
  <text x="560" y="264" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".55">Sonnet 5 + thinking</text>
  <text x="560" y="276" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".55">4 in flight · $1 cap each</text>

  <line x1="650" y1="250" x2="690" y2="250" stroke="#5cb8c6" stroke-width="1.5" marker-end="url(#arf)"/>
  <rect x="692" y="226" width="110" height="48" rx="3" fill="#141c1f" stroke="#e8efed" stroke-width="1.2"/>
  <text x="747" y="245" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#e8efed">fan in</text>
  <text x="747" y="259" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".65">SELECT's order</text>
  <text x="747" y="270" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".65">near-dup check</text>

  <line x1="802" y1="250" x2="836" y2="250" stroke="#5cb8c6" stroke-width="1.5" marker-end="url(#arf)"/>
  <rect x="838" y="226" width="64" height="48" rx="3" fill="#141c1f" stroke="#5cb8c6" stroke-width="1.4" opacity=".75"/>
  <text x="870" y="245" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#5cb8c6">PRE-</text>
  <text x="870" y="257" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#5cb8c6">HEADER</text>
  <text x="870" y="269" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9" fill="#e8efed" opacity=".55">Haiku 4.5</text>

  <path d="M 870 274 L 870 300 L 755 300 L 755 322" fill="none" stroke="#d6a441" stroke-width="1.6" marker-end="url(#ar)" opacity=".9"/>

  <!-- COHERENCE -->
  <rect x="670" y="324" width="170" height="64" rx="3" fill="#141c1f" stroke="#d6a441" stroke-width="2.2"/>
  <text x="755" y="344" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#d6a441">COHERENCE</text>
  <text x="755" y="359" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="10.5" fill="#e8efed" opacity=".75">every specific vs cited sources</text>
  <text x="755" y="373" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="600" fill="#d6a441">Sonnet 5 + thinking</text>

  <path d="M 670 356 L 636 356" fill="none" stroke="#d6a441" stroke-width="1.5" marker-end="url(#ar)" opacity=".85"/>
  <text x="653" y="349" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="9" fill="#e8efed" opacity=".7">failed</text>
  <rect x="466" y="330" width="170" height="52" rx="3" fill="#141c1f" stroke="#d6a441" stroke-width="1.5" opacity=".85"/>
  <text x="551" y="347" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#d6a441">REPAIR + RECHECK</text>
  <text x="551" y="361" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".6">Sonnet 4.6</text>
  <text x="551" y="373" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="9.5" fill="#e8efed" opacity=".6">recheck: Sonnet 5 + thinking</text>
  <path d="M 466 356 L 452 356 L 452 410 L 855 410 L 855 392" fill="none" stroke="#d6a441" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)" opacity=".7"/>
  <text x="653" y="423" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="9.5" fill="#e8efed" opacity=".7">fixed field re-checked once; still failing → dropped</text>

  <!-- exit the lane, down and across to the first assembly box -->
  <path d="M 755 444 L 755 458 L 169 458 L 169 474" fill="none" stroke="#e8efed" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- assembly, left to right -->
  <rect x="86" y="476" width="166" height="44" rx="3" fill="#141c1f" stroke="#e8efed" stroke-width="1.4"/>
  <text x="169" y="494" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e8efed">assemble + grade</text>
  <text x="169" y="509" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#e8efed" opacity=".65">merge.py · schema + graders</text>

  <line x1="252" y1="498" x2="298" y2="498" stroke="#e8efed" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="300" y="476" width="164" height="44" rx="3" fill="#141c1f" stroke="#e8efed" stroke-width="1.4"/>
  <text x="382" y="494" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e8efed">IDs → real URLs</text>
  <text x="382" y="509" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#e8efed" opacity=".65">+ source, bias</text>

  <line x1="464" y1="498" x2="510" y2="498" stroke="#e8efed" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="512" y="476" width="164" height="44" rx="3" fill="#141c1f" stroke="#e8efed" stroke-width="1.4"/>
  <text x="594" y="494" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#e8efed">render HTML + MJML</text>
  <text x="594" y="509" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#e8efed" opacity=".65">email + archive page</text>

  <line x1="676" y1="498" x2="722" y2="498" stroke="#e8efed" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="724" y="476" width="120" height="44" rx="3" fill="#141c1f" stroke="#7fb98c" stroke-width="1.8"/>
  <text x="784" y="494" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#7fb98c">Resend</text>
  <text x="784" y="509" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="10" fill="#e8efed" opacity=".65">subscribers</text>

  <text x="86" y="566" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#e8efed" opacity=".7">Every arrow between stages is a JSON file on disk, including each write branch. A failed run resumes from whatever</text>
  <text x="86" y="582" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#e8efed" opacity=".7">finished, and any past run can be replayed from its archived artifacts.</text>
  <text x="86" y="604" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" fill="#e8efed" opacity=".7">Not drawn: story threads, and the healthchecks.io heartbeat each stage posts.</text>
</svg>

